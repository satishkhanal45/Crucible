name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crucible
          POSTGRES_PASSWORD: crucible
          POSTGRES_DB: crucible
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crucible -d crucible"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CRUCIBLE_TEST_DATABASE_URL: postgresql+asyncpg://crucible:crucible@localhost:5432/crucible

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration

      # Every number in docs/findings.md is regenerated from stored data. The
      # unit suite asserts the committed blocks match; this asserts the CLI that
      # writes them agrees, against a migrated database.
      - name: Findings are regenerated, not hand-typed
        run: |
          uv run alembic upgrade head
          uv run crucible findings regenerate --check
        env:
          DATABASE_URL: postgresql+asyncpg://crucible:crucible@localhost:5432/crucible
