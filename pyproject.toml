[project]
name = "crucible"
version = "0.1.0"
description = "A co-evolutionary red-team loop for RAG systems."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.2.60",
    "matplotlib>=3.9",
    "langgraph-checkpoint-postgres>=2.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "rich>=13.9",
    "pydantic-settings>=2.7",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "sentence-transformers>=3.3",
    # Direct dependency only so `tool.uv.sources` can pin it to the CPU wheels.
    "torch>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "testcontainers>=4.9",
]

# torch ships CUDA wheels by default; this project is CPU-only on a 12GB box.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
crucible = "crucible.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ARG", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["crucible"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/crucible"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL + pgvector database"]
filterwarnings = ["error::DeprecationWarning:crucible.*"]
